<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>会場マップ ｜ WAKABA杯</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Oswald:wght@500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260617">
  <link rel="stylesheet" href="css/map.css?v=20260612">
</head>

<body class="map-body">

  <!-- ===== Header ===== -->
  <header class="map-header">
    <div class="container map-header-inner">
      <a href="index.html" class="nav-logo">
        <span class="nav-logo-en">WAKABA</span>
        <span class="nav-logo-jp">杯</span>
      </a>
      <span class="map-header-tag">MAP</span>
    </div>
  </header>

  <!-- ===== 非公開 注意バナー ===== -->
  <div class="map-warning">
    <div class="container">
      <strong>⚠ このページは非公開です。</strong>
      参加チーム・関係者向けです。URLの取扱いにご注意ください。
    </div>
  </div>

  <!-- ===== Hero ===== -->
  <section class="map-hero">
    <div class="container">
      <span class="map-hero-eyebrow">ACCESS &amp; VENUE</span>
      <h1 class="map-hero-title">会場マップ</h1>
      <p class="map-hero-meta">
        2026.06.20 (土) ／ テクノポート福井スタジアム
      </p>
    </div>
  </section>

  <!-- ===== マップ =====
       ▼ 画像を差し替える場合は assets/map-area.jpg / assets/map-stadium.jpg を入れ替え。
         拡大表示は <a> の href が画像本体を指しています。 -->
  <div class="map-grid">

    <section class="map-figure">
      <div class="map-figure-head">
        <span class="map-figure-num">01</span>
        <h2 class="map-figure-title">会場周辺マップ</h2>
      </div>
      <a class="map-figure-link" href="assets/map-area.jpg?v=20260616" target="_blank" rel="noopener">
        <img src="assets/map-area.jpg?v=20260616" alt="テクノポート福井スタジアム 周辺マップ（入場ルート・臨時駐車場）">
      </a>
      <div class="map-figure-foot">
        <p class="map-figure-note">当日は地図の指定ルートよりご入場・ご駐車ください（臨時駐車場 約915台）。</p>
        <span class="map-figure-zoom">タップで拡大 ↗</span>
      </div>
    </section>

    <section class="map-figure">
      <div class="map-figure-head">
        <span class="map-figure-num">02</span>
        <h2 class="map-figure-title">スタジアムマップ</h2>
      </div>
      <a class="map-figure-link" href="assets/map-stadium.jpg?v=20260612" target="_blank" rel="noopener">
        <img src="assets/map-stadium.jpg?v=20260612" alt="テクノポート福井スタジアム 場内マップ（コート配置・各チームテント待機場所・本部）">
      </a>
      <div class="map-figure-foot">
        <p class="map-figure-note">コート配置（COURT A / B）、各チームのテント待機場所、本部・駐車場の位置を記載しています。</p>
        <span class="map-figure-zoom">タップで拡大 ↗</span>
      </div>
    </section>

  </div>

  <!-- ===== Footer ===== -->
  <footer class="map-footer">
    <div class="container">
      <p>© 2026 WAKABA杯 運営事務局</p>
      <p style="margin-top:8px;"><a href="index.html">← TOPページへ戻る</a></p>
    </div>
  </footer>

</body>

</html>
